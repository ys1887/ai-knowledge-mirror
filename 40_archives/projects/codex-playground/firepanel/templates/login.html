<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FirePanel | 認証</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='panel.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <p class="eyebrow">FIREPANEL</p>
    <h1>PC操作パネル</h1>
    <p class="muted">Windows側の設定画面で登録した合言葉を入力してください。</p>
    <form method="post" action="{{ url_for('login') }}">
      <label for="password">合言葉</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <button class="primary" type="submit">開く</button>
    </form>
  </main>
</body>
</html>
